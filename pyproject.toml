[project]
name = "ragaas"
version = "0.1.0"
description = "RAG-as-a-Service — Intelligent document search & Q&A API"
authors = [{ name = "Mohammed Alaa" }]
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.0",
    "psycopg2-binary>=2.9",
    "django-environ>=0.11",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.7.0",
    "structlog>=24.1.0",
    "anthropic>=0.25.0",
    "dashscope>=1.25.21",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-django>=4.8",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "ragaas"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S104", "S106"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
