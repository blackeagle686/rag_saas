
services:
  # == PostgreSQL ==
  postgres:
    image: postgres:16-alpine
    container_name: ragaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragaas
      POSTGRES_USER: ragaas
      POSTGRES_PASSWORD: ragaas_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # == Redis ==
  redis:
    image: redis:7-alpine
    container_name: ragaas-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  # == Qdrant Vector DB ==
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragaas-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # == FastAPI Application ==
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragaas-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ragaas:ragaas_secret@postgres:5432/ragaas
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - storagedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2

  # == Celery Worker ==
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragaas-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ragaas:ragaas_secret@postgres:5432/ragaas
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - storagedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      celery -A workers.celery_app worker
      --loglevel=info
      --concurrency=2

  # == Frontend Static Server (Nginx) ==
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragaas-frontend
    restart: unless-stopped
    ports:
      - "5000:80"

  # == Ngrok Tunnel ==
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ragaas-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "frontend:80"
    environment:
      - NGROK_AUTHTOKEN=36jW6kAV8Inp5SHYiuIicuuRols_7NkiWdLme3iULLJx3gMS5
    depends_on:
      - frontend

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  storagedata:

